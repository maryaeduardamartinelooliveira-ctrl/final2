<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Consulta —Saúde click</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <p>🏥Saúde  click</p>
    <nav>
      <a href="index.html">Início</a>
      <a href="especialidade.html">Especialidades</a>
      <a href="medicos.html">Médicos</a>
      <a href="agendar.html">Agendar Consulta</a>
      <a href="paciente.html">Área do Paciente</a>
      <a href="contato.html">Contato</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </header>
  <main>

    <h1>Agendar Consulta</h1>

    <form>

      <label for="especialidade">Especialidade</label><br>
      <select id="especialidade" name="especialidade">
        <option value="Clínica Geral">Clínica Geral</option>
        <option value="Enfermagem">Enfermagem</option>
        <option value="Pré-natal (Gestantes)">Pré-natal (Gestantes)</option>
        <option value="Hiperdia">Hiperdia</option>
        <option value="Odontologia">Odontologia</option>
      </select>
      <br><br>

      <label for="medico">Médico</label><br>
      <select id="medico" name="medico">
        <option value="Dra. Ana Beatriz Souza">Dra. Ana Beatriz Souza</option>
        <option value="Dr. Carlos Eduardo Lima">Dr. Carlos Eduardo Lima</option>
      </select>
      <br><br>

      <label for="data">Data</label><br>
      <input type="date" id="data" name="data">
      <br><br>

      <label for="hora">Horário</label><br>
      <select id="hora" name="hora">
        <option value="08:00">08:00</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="13:30">13:30</option>
        <option value="14:30">14:30</option>
        <option value="15:30">15:30</option>
        <option value="16:30">16:30</option>
      </select>
      <br><br>

      <label for="nome">Nome completo</label><br>
      <input type="text" id="nome" name="nome">
      <br><br>

      <label for="cpf">CPF</label><br>
      <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
      <br><br>

      <label for="nascimento">Data de nascimento</label><br>
      <input type="date" id="nascimento" name="nascimento">
      <br><br>

      <label for="telefone">Telefone</label><br>
      <input type="tel" id="telefone" name="telefone" placeholder="(27) 90000-0000">
      <br><br>

      <label for="email">E-mail</label><br>
      <input type="email" id="email" name="email">
      <br><br>

      <label for="convenio">Convênio</label><br>
      <select id="convenio" name="convenio">
        <option value="SUS / Particular">SUS / Particular</option>
        <option value="Unimed">Unimed</option>
        <option value="Bradesco Saúde">Bradesco Saúde</option>
        <option value="Outro">Outro</option>
      </select>
      <br><br>

      <button type="submit">Confirmar Agendamento</button>

    </form>

    <div id="mensagem-confirmacao" style="display:none;"></div>

  </main>

  <script>
    const form = document.querySelector("form");
    const mensagem = document.querySelector("#mensagem-confirmacao");

    form.addEventListener("submit", function (evento) {
      evento.preventDefault();

      const especialidade = document.querySelector("#especialidade").value;
      const medico = document.querySelector("#medico").value;
      const data = document.querySelector("#data").value;
      const hora = document.querySelector("#hora").value;
      const emailPaciente = document.querySelector("#email").value;

      localStorage.setItem("consulta-especialidade", especialidade);
      localStorage.setItem("consulta-medico", medico);
      localStorage.setItem("consulta-data", data);
      localStorage.setItem("consulta-hora", hora);
      localStorage.setItem("consulta-email", emailPaciente);

      mensagem.textContent = "✅ Consulta agendada com sucesso! Você receberá um lembrete por e-mail.";
      mensagem.style.display = "block";
    });
  </script>

</body>

</html>
